# Menus
bindd = SUPER, SPACE, Launch apps, exec, walker
bindd = SUPER CTRL, E, Emoji picker, exec, walker -m symbols
bindd = SUPER CTRL, C, Capture menu, exec, app-menu capture
bindd = SUPER CTRL, O, Toggle menu, exec, app-menu toggle
bindd = SUPER ALT, SPACE, App menu, exec, app-menu
bindd = SUPER, ESCAPE, System menu, exec, app-menu system
bindld = , XF86PowerOff, Power menu, exec, app-menu system
bindd = SUPER, K, Show key bindings, exec, keybindings-viewer
bindd = , XF86Calculator, Calculator, exec, gnome-calculator

# Aesthetics
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, pkill -x waybar || uwsm-app -- waybar
bindd = SUPER, BACKSPACE, Toggle window transparency, exec, hyprctl dispatch setprop "address:$(hyprctl activewindow -j | jq -r '.address')" opaque toggle
bindd = SUPER SHIFT, BACKSPACE, Toggle window gaps, exec, toggle-gaps
bindd = SUPER CTRL, BACKSPACE, Toggle single-window square aspect, exec, toggle-window-aspect

# Notifications
bindd = SUPER, COMMA, Dismiss last notification, exec, makoctl dismiss
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all
bindd = SUPER CTRL, COMMA, Toggle silencing notifications, exec, toggle-notifications
bindd = SUPER ALT, COMMA, Invoke last notification, exec, makoctl invoke
bindd = SUPER SHIFT ALT, COMMA, Restore last notification, exec, makoctl restore

# Toggles
bindd = SUPER CTRL, I, Toggle locking on idle, exec, toggle-idle
bindd = SUPER CTRL, N, Toggle nightlight, exec, toggle-nightlight

# Captures
bindd = , PRINT, Screenshot, exec, screenshot
bindd = ALT, PRINT, Screenrecord menu, exec, app-menu screenrecord
bindd = SUPER, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a
bindd = SUPER CTRL, PRINT, Extract text (OCR), exec, capture-text

# File sharing
bindd = SUPER CTRL, S, Share, exec, app-menu share

# Information
bindd = SUPER CTRL ALT, T, Show time, exec, notify-send "    $(date +"%A %H:%M  —  %d %B W%V %Y")"
bindd = SUPER CTRL ALT, B, Show battery, exec, battery-status

# Control panels
bindd = SUPER CTRL, A, Audio controls, exec, launch-audio
bindd = SUPER CTRL, B, Bluetooth controls, exec, launch-bluetooth
bindd = SUPER CTRL, W, Wifi controls, exec, launch-wifi
bindd = SUPER CTRL, T, Activity, exec, launch-btop

# Zoom
bindd = SUPER CTRL, Z, Zoom in, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')
bindd = SUPER CTRL ALT, Z, Reset zoom, exec, hyprctl keyword cursor:zoom_factor 1

# Lock system
bindd = SUPER CTRL, L, Lock system, exec, lock-screen
