source = ~/.config/omarchy/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = ~/.config/omarchy/current/background
    blur_passes = 4
    blur_size = 8
    noise = 0.01
    brightness = 0.7
    contrast = 0.9
}

animations {
    enabled = true
    bezier = smooth, 0.05, 0.9, 0.1, 1.0
    animation = global, 1, 3, smooth
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = Rubik
    color = $font_color

    position = 0, 180
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 3
}

# Date
label {
    monitor =
    text = cmd[update:3600000] date +"%A, %d %B"
    font_size = 16
    font_family = Rubik
    color = $font_color

    position = 0, 120
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 2
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -20
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 2

    font_family = Rubik
    font_color = $font_color

    placeholder_text =
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 14
    shadow_passes = 1
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}
