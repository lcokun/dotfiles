[colors.primary]
background = "{{colors.background.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"
dim_foreground = "{{colors.on_surface_variant.default.hex}}"

[colors.cursor]
text = "{{colors.background.default.hex}}"
cursor = "{{colors.on_surface.default.hex}}"

[colors.selection]
text = "{{colors.on_primary.default.hex}}"
background = "{{colors.primary.default.hex}}"

[colors.normal]
black   = "{{colors.background.default.hex}}"
red     = "{{colors.error.default.hex}}"
green   = "{{base16.base0b.default.hex}}"
yellow  = "{{colors.tertiary.default.hex}}"
blue    = "{{colors.outline.default.hex}}"
magenta = "{{colors.primary.default.hex}}"
cyan    = "{{colors.on_surface_variant.default.hex}}"
white   = "{{colors.on_surface.default.hex}}"

[colors.bright]
black   = "{{colors.surface_variant.default.hex}}"
red     = "{{base16.base08.default.hex}}"
green   = "{{base16.base0c.default.hex}}"
yellow  = "{{colors.primary_fixed.default.hex}}"
blue    = "{{colors.secondary.default.hex}}"
magenta = "{{colors.source_color.default.hex}}"
cyan    = "{{colors.tertiary_fixed.default.hex}}"
white   = "{{colors.primary_fixed.default.hex}}"
