[config]

# Extra hues for syntax highlighting and terminal ANSI; matugen harmonizes them toward the seed.
# Exposed as {{colors.<name>.default.hex}}. Used by vscodium.json, zed.json and kitty.conf.
[config.custom_colors]
green  = "#50c878"
orange = "#e8913a"
blue   = "#4f8fdf"
cyan   = "#3fb8c0"
yellow = "#e5c33a"

[templates.ghostty]
input_path  = "~/.config/matugen/templates/ghostty.conf"
output_path = "~/.config/omarchy/themes/matugen/ghostty.conf"

[templates.kitty]
input_path  = "~/.config/matugen/templates/kitty.conf"
output_path = "~/.config/omarchy/themes/matugen/kitty.conf"

[templates.alacritty]
input_path  = "~/.config/matugen/templates/alacritty.toml"
output_path = "~/.config/omarchy/themes/matugen/alacritty.toml"

[templates.waybar]
input_path  = "~/.config/matugen/templates/waybar.css"
output_path = "~/.config/omarchy/themes/matugen/waybar.css"

[templates.hyprland]
input_path  = "~/.config/matugen/templates/hyprland.conf"
output_path = "~/.config/omarchy/themes/matugen/hyprland.conf"

[templates.mako]
input_path  = "~/.config/matugen/templates/mako.ini"
output_path = "~/.config/omarchy/themes/matugen/mako.ini"

[templates.walker]
input_path  = "~/.config/matugen/templates/walker.css"
output_path = "~/.config/omarchy/themes/matugen/walker.css"

[templates.hyprlock]
input_path  = "~/.config/matugen/templates/hyprlock.conf"
output_path = "~/.config/omarchy/themes/matugen/hyprlock.conf"

[templates.ytmusic]
input_path  = "~/.config/matugen/templates/ytmusic.css"
output_path = "~/.config/ytmusic/theme.css"

[templates.ytm-cli]
input_path  = "~/.config/matugen/templates/ytm-cli.tcss"
output_path = "~/.config/ytm-cli/tui.tcss"

[templates.zed]
input_path  = "~/.config/matugen/templates/zed.json"
output_path = "~/.config/zed/themes/matugen.json"

[templates.spicetify]
input_path  = "~/.config/matugen/templates/spicetify.css"
output_path = "~/.config/spicetify/matugen/colors.css"

[templates.vscodium]
input_path  = "~/.config/matugen/templates/vscodium.json"
output_path = "~/.vscode-oss/extensions/local.matugen-theme-0.0.1/themes/matugen.json"
